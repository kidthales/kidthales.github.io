name: CI

on:
  push:
    branches:
      - next
      - main
  pull_request:
    branches:
      - next
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security & Workflow Audits (Gitleaks & zizmor)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks secret detection
        if: github.event_name != 'release'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run zizmor GitHub Actions security analysis
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify & Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run CI Orchestrator
        shell: pwsh
        run: ./scripts/ci-local.ps1 -CI

      - name: Upload build artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  notify:
    name: Discord CI Notification
    needs: [security, verify]
    if: always() && github.event_name != 'workflow_call' && github.workflow == 'CI'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK }}
    steps:
      - name: Dispatch consolidated status card to #dev-ci-builds
        if: env.WEBHOOK_URL != ''
        env:
          JOB_STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=2263091
            TITLE="✅ CI Passed — kidthales.github.io"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            COLOR=11184810
            TITLE="⚪ CI Cancelled — kidthales.github.io"
          else
            COLOR=15087942
            TITLE="❌ CI Failed — kidthales.github.io"
          fi

          jq -n \
            --arg title "$TITLE" \
            --arg url "$RUN_URL" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg sha "$SHA" \
            --argjson color "$COLOR" \
            '{
              username: "kidthales CI",
              avatar_url: "https://kidthales.com/favicon-96x96.png",
              embeds: [{
                title: $title,
                url: $url,
                color: $color,
                fields: [
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Commit", value: ($sha | .[0:7]), inline: true }
                ],
                footer: {
                  text: "GitHub Actions • kidthales.github.io",
                  icon_url: "https://kidthales.com/favicon-96x96.png"
                }
              }]
            }' | curl -fsSL -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"
