version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "@kidthales/picotol"

  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    groups:
      all-dependencies:
        patterns:
          - "*"
