name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch: ~

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install and Build
        run: |
          npm ci
          npm run build
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: live
          folder: dist
          clean-exclude: |
            CNAME
      - name: Notify Discord (#dev-ci-builds)
        if: always()
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "Warning: No DISCORD_CI_WEBHOOK configured. Skipping notification."
            exit 0
          fi

          STATUS_LOWER=$(echo "$JOB_STATUS" | tr '[:upper:]' '[:lower:]')
          if [ "$STATUS_LOWER" = "success" ]; then
            COLOR=4388484
            STATUS_ICON="✅"
            TITLE="Portal Deploy Passed: $REPO_NAME"
          elif [ "$STATUS_LOWER" = "failure" ]; then
            COLOR=15088454
            STATUS_ICON="❌"
            TITLE="Portal Deploy Failed: $REPO_NAME"
          else
            COLOR=13202208
            STATUS_ICON="⚠️"
            TITLE="Portal Deploy Cancelled: $REPO_NAME"
          fi

          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          RUN_URL="$SERVER_URL/$REPO_NAME/actions/runs/$RUN_ID"

          PAYLOAD=$(cat <<EOF
          {
            "username": "kidthales CI/CD",
            "avatar_url": "https://github.com/kidthales.png",
            "embeds": [
              {
                "title": "$STATUS_ICON $TITLE",
                "color": $COLOR,
                "description": "GitHub Pages CD deployment completed for branch \`$BRANCH_NAME\`.",
                "url": "$RUN_URL",
                "author": {
                  "name": "kidthales Systems CI",
                  "icon_url": "https://github.com/kidthales.png"
                },
                "fields": [
                  { "name": "Repository", "value": "\`$REPO_NAME\`", "inline": true },
                  { "name": "Branch", "value": "\`$BRANCH_NAME\`", "inline": true },
                  { "name": "Triggered By", "value": "@$ACTOR", "inline": true },
                  { "name": "Workflow", "value": "$WORKFLOW_NAME", "inline": true },
                  { "name": "Commit", "value": "[\`$SHORT_SHA\`]($SERVER_URL/$REPO_NAME/commit/$COMMIT_SHA)", "inline": true },
                  { "name": "Run Details", "value": "[View Run]($RUN_URL)", "inline": true }
                ],
                "footer": {
                  "text": "kidthales Automation • Antigravity",
                  "icon_url": "https://github.com/kidthales.png"
                },
                "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              }
            ]
          }
          EOF
          )

          curl -s -S -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL" > /dev/null || echo "Warning: Discord webhook dispatch failed."

